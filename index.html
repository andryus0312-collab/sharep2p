<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir Archivos P2P</title>
    
    <!-- 🔗 CSS desde carpeta css -->
    <link rel="stylesheet" href="css/styles.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    
    <!-- 📱 Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>📤 Compartir Archivos</h1>
        <p class="subtitle">Selecciona y comparte por Bluetooth o Wi-Fi</p>
        
        <div class="upload-section">
            <input type="file" id="fileInput" multiple accept="image/*,video/*,.pdf,.doc,.docx">
            <label for="fileInput" class="upload-btn">📂 Seleccionar Archivos</label>
        </div>

        <div id="fileList" class="file-list"></div>

        <button id="shareBtn" class="share-btn" disabled>🚀 Compartir</button>
        
        <!-- 🆕 NUEVO BOTÓN: Generar QR de invitación -->
        <button id="qrBtn" class="qr-btn">📱 Generar QR de Invitación</button>
        
        <div id="status" class="status"></div>
    </div>

    <!-- 🆕 NUEVO MODAL: Panel del código QR -->
    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-content">
            <div class="qr-modal-header">
                <h2> Escanea para unirte</h2>
                <button id="closeQrModal" class="close-qr-btn"></button>
            </div>
            <div class="qr-modal-body">
                <p class="qr-message">¡Hola! Te invito a usar <strong>ShareP2P</strong> para compartir archivos de forma rápida y segura.</p>
                <div id="qrcode" class="qrcode-container"></div>
                <p class="qr-instruction"> Escanea este código con tu cámara</p>
                <div class="qr-link-box">
                    <p class="qr-link-label">O copia este enlace:</p>
                    <input type="text" id="qrLinkInput" class="qr-link-input" readonly>
                    <button id="copyLinkBtn" class="copy-link-btn">📋 Copiar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🔍 BOTÓN Y PANEL DE CONSOLA -->
    <button id="debugBtn" class="debug-btn">🔍</button>
    <div id="debugPanel" class="debug-panel">
        <div class="debug-header">
            <span>🔍 Consola de Depuración</span>
            <button id="closeDebug" class="close-btn">✕</button>
        </div>
        <div class="debug-content">
            <pre id="debugOutput">Toca el botón para iniciar...</pre>
        </div>
        <div class="debug-actions">
            <button id="copyDebug" class="debug-action-btn"> Copiar</button>
            <button id="clearDebug" class="debug-action-btn">️ Limpiar</button>
        </div>
    </div>

    <!-- 🔗 JavaScript desde carpeta js -->
    <script src="js/app.js"></script>
</body>
                    </html>
