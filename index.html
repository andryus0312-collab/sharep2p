<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir Archivos P2P</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    
    <!--  TODOS LOS ESTILOS CSS ESTÁN AQUÍ -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white; border-radius: 20px; padding: 30px;
            max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { margin-bottom: 10px; color: #333; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 14px; }
        .upload-section { margin-bottom: 20px; }
        #fileInput { display: none; }
        .upload-btn {
            display: inline-block; padding: 15px 30px; background: #667eea;
            color: white; border-radius: 10px; cursor: pointer;
            font-size: 16px; font-weight: bold; transition: transform 0.2s;
        }
        .upload-btn:active { transform: scale(0.95); }
        .file-list { margin: 20px 0; min-height: 20px; text-align: left; }
        .file-item {
            background: #f0f0f0; padding: 10px 15px; margin: 8px 0;
            border-radius: 8px; display: flex; justify-content: space-between;
            align-items: center; font-size: 14px; color: #333;
        }
        .share-btn {
            width: 100%; padding: 15px; background: #ccc; color: #666;
            border: none; border-radius: 10px; font-size: 18px;
            font-weight: bold; cursor: not-allowed; transition: all 0.3s;
        }
        .share-btn.active {
            background: #10b981; color: white; cursor: pointer;
        }
        .share-btn.active:active { transform: scale(0.98); }
        .status {
            margin-top: 20px; padding: 12px; border-radius: 10px;
            text-align: center; display: none; font-size: 14px;
        }
        .status.success { background: #d1fae5; color: #065f46; display: block; }
        .status.error { background: #fee2e2; color: #991b1b; display: block; }

        /* 🔍 CONSOLA FLOTANTE */
        .debug-btn {
            position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px;
            border-radius: 50%; background: #667eea; color: white; border: none;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            z-index: 9999;
        }
        .debug-panel {
            position: fixed; bottom: 90px; right: 20px; left: 20px; max-width: 400px;
            max-height: 60vh; background: #1e1e1e; color: #00ff00;
            border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 9998; display: none; flex-direction: column;
            overflow: hidden; font-family: 'Courier New', monospace; font-size: 12px;
        }
        .debug-panel.active { display: flex; }
        .debug-header {
            background: #333; color: white; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-family: sans-serif;
        }
        .close-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .debug-content { padding: 12px; overflow-y: auto; flex: 1; }
        .debug-content pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
        .debug-actions { display: flex; gap: 8px; padding: 12px; background: #333; border-top: 1px solid #444; }
        .debug-action-btn {
            flex: 1; padding: 8px; background: #667eea; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .log-line { margin: 4px 0; padding: 4px 8px; border-left: 3px solid #667eea; background: rgba(102, 126, 234, 0.1); color: #ddd; }
        .log-line.error { border-left-color: #ff4444; color: #ff6666; }
        .log-line.success { border-left-color: #00ff00; color: #00ff00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Compartir Archivos</h1>
        <p class="subtitle">Selecciona y comparte por Bluetooth o Wi-Fi</p>
        
        <div class="upload-section">
            <input type="file" id="fileInput" multiple accept="image/*,video/*,.pdf,.doc,.docx">
            <label for="fileInput" class="upload-btn">📂 Seleccionar Archivos</label>
        </div>

        <div id="fileList" class="file-list"></div>

        <button id="shareBtn" class="share-btn" disabled>🚀 Compartir</button>
        <div id="status" class="status"></div>
    </div>

    <!-- 🔍 BOTÓN Y PANEL DE CONSOLA -->
    <button id="debugBtn" class="debug-btn">🔍</button>
    <div id="debugPanel" class="debug-panel">
        <div class="debug-header">
            <span> Consola de Depuración</span>
            <button id="closeDebug" class="close-btn">✕</button>
        </div>
        <div class="debug-content">
            <pre id="debugOutput">Toca el botón para iniciar...</pre>
        </div>
        <div class="debug-actions">
            <button id="copyDebug" class="debug-action-btn">📋 Copiar</button>
            <button id="clearDebug" class="debug-action-btn">🗑️ Limpiar</button>
        </div>
    </div>

    <!-- ⚙️ TODO EL JAVASCRIPT ESTÁ AQUÍ -->
    <script>
        // 1️ PRUEBA DE FUEGO: Si esto no sale, el JS no está cargando
        alert('¡Sistema iniciando! Si ves esto, el código funciona.');

        document.addEventListener('DOMContentLoaded', () => {
            console.log('✅ DOM Cargado');
            
            // Elementos
            const fileInput = document.getElementById('fileInput');
            const fileList = document.getElementById('fileList');
            const shareBtn = document.getElementById('shareBtn');
            const statusDiv = document.getElementById('status');
            const debugBtn = document.getElementById('debugBtn');
            const debugPanel = document.getElementById('debugPanel');
            
            let selectedFiles = [];

            // 📂 LÓGICA DE SELECCIÓN DE ARCHIVOS
            fileInput.addEventListener('change', (e) => {
                console.log('📂 Archivos seleccionados:', e.target.files.length);
                selectedFiles = Array.from(e.target.files);
                
                if (selectedFiles.length > 0) {
                    // Mostrar lista
                    fileList.innerHTML = selectedFiles.map(file => `
                        <div class="file-item">
                            <span>📄 ${file.name}</span>
                            <span>${(file.size / 1024).toFixed(1)} KB</span>
                        </div>
                    `).join('');
                    
                    // Activar botón
                    shareBtn.disabled = false;
                    shareBtn.classList.add('active');
                    shareBtn.textContent = `🚀 Compartir (${selectedFiles.length})`;
                } else {
                    fileList.innerHTML = '';
                    shareBtn.disabled = true;
                    shareBtn.classList.remove('active');
                    shareBtn.textContent = '🚀 Compartir';
                }
            });

            // 🚀 LÓGICA DE COMPARTIR
            shareBtn.addEventListener('click', async () => {
                if (selectedFiles.length === 0) return;
                
                try {
                    statusDiv.textContent = '📤 Abriendo menú...';
                    statusDiv.className = 'status success';
                    
                    await navigator.share({
                        files: selectedFiles,
                        title: 'Archivos desde ShareP2P'
                    });
                    
                    statusDiv.textContent = '✅ ¡Compartido!';
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        statusDiv.textContent = '❌ Error: ' + err.message;
                        statusDiv.className = 'status error';
                    }
                }
            });

            // 🔍 LÓGICA DE LA CONSOLA
            let logs = [];
            const addLog = (msg, type='info') => {
                logs.push({msg, type, time: new Date().toLocaleTimeString()});
                document.getElementById('debugOutput').innerHTML = logs.map(l => 
                    `<div class="log-line ${l.type}">[${l.time}] ${l.msg}</div>`
                ).join('');
            };

            debugBtn.addEventListener('click', () => {
                debugPanel.classList.add('active');
                logs = [];
                addLog('🔍 Diagnóstico iniciado', 'info');
                addLog(navigator.share ? '✅ Web Share API: OK' : '❌ Web Share API: Falta', navigator.share ? 'success' : 'error');
                addLog(window.location.protocol === 'https:' ? '✅ HTTPS: OK' : ' HTTPS: Falta', window.location.protocol === 'https:' ? 'success' : 'error');
            });

            document.getElementById('closeDebug').addEventListener('click', () => debugPanel.classList.remove('active'));
            document.getElementById('clearDebug').addEventListener('click', () => { logs = []; document.getElementById('debugOutput').innerHTML = ''; });
        });
    </script>
</body>
    </html>
